asyncapi: '3.1.0'
info:
  title: Streetlights Kafka API
  version: '1.0.0'

channels:
  "smartylighting.streetlights.1.0.event.{streetlightId}.lighting.measured":
    address: "smartylighting.streetlights.1.0.event.{streetlightId}.lighting.measured"
    description: The topic on which measured values may be produced and consumed.
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    messages:
      lightMeasured:
        $ref: '#/components/messages/lightMeasured'

  "smartylighting.streetlights.1.0.action.{streetlightId}.turn.on":
    address: "smartylighting.streetlights.1.0.action.{streetlightId}.turn.on"
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    messages:
      turnOnOff:
        $ref: '#/components/messages/turnOnOff'

  "smartylighting.streetlights.1.0.action.{streetlightId}.turn.off":
    address: "smartylighting.streetlights.1.0.action.{streetlightId}.turn.off"
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    messages:
      turnOnOff:
        $ref: '#/components/messages/turnOnOff'

  "smartylighting.streetlights.1.0.action.{streetlightId}.dim":
    address: "smartylighting.streetlights.1.0.action.{streetlightId}.dim"
    parameters:
      streetlightId:
        $ref: '#/components/parameters/streetlightId'
    messages:
      dimLight:
        $ref: '#/components/messages/dimLight'

operations:
  receiveLightMeasurement:
    action: receive
    channel:
      $ref: '#/channels/smartylighting.streetlights.1.0.event.{streetlightId}.lighting.measured'
    summary: Inform about environmental lighting conditions of a particular streetlight.
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/components/messages/lightMeasured'

  turnOn:
    action: send
    channel:
      $ref: '#/channels/smartylighting.streetlights.1.0.action.{streetlightId}.turn.on'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/components/messages/turnOnOff'

  turnOff:
    action: send
    channel:
      $ref: '#/channels/smartylighting.streetlights.1.0.action.{streetlightId}.turn.off'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/components/messages/turnOnOff'

  dimLight:
    action: send
    channel:
      $ref: '#/channels/smartylighting.streetlights.1.0.action.{streetlightId}.dim'
    traits:
      - $ref: '#/components/operationTraits/kafka'
    messages:
      - $ref: '#/components/messages/dimLight'

components:
  messages:
    lightMeasured:
      name: lightMeasured
      title: Light measured
      summary: Inform about environmental lighting conditions of a particular streetlight.
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: '#/components/schemas/lightMeasuredPayload'

    turnOnOff:
      name: turnOnOff
      title: Turn on/off
      summary: Command a particular streetlight to turn the lights on or off.
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: '#/components/schemas/turnOnOffPayload'

    dimLight:
      name: dimLight
      title: Dim light
      summary: Command a particular streetlight to dim the lights.
      traits:
        - $ref: '#/components/messageTraits/commonHeaders'
      payload:
        $ref: '#/components/schemas/dimLightPayload'

  schemas:
    lightMeasuredPayload:
      type: object
      properties:
        lumens:
          type: integer
          minimum: 0
          description: Light intensity measured in lumens.
        sentAt:
          $ref: '#/components/schemas/sentAt'

    turnOnOffPayload:
      type: object
      properties:
        command:
          type: string
          enum:
            - on
            - off
          description: Whether to turn on or off the light.
        sentAt:
          $ref: '#/components/schemas/sentAt'

    dimLightPayload:
      type: object
      properties:
        percentage:
          type: integer
          description: Percentage to which the light should be dimmed to.
          minimum: 0
          maximum: 100
        sentAt:
          $ref: '#/components/schemas/sentAt'

    sentAt:
      type: string
      format: date-time
      description: Date and time when the message was sent.

  securitySchemes:
    saslScram:
      type: scramSha256
      description: Provide your username and password for SASL/SCRAM authentication

  parameters:
    streetlightId:
      description: The ID of the streetlight.
      schema:
        type: string

  messageTraits:
    commonHeaders:
      headers:
        type: object
        properties:
          my-app-header:
            type: integer
            minimum: 0
            maximum: 100

  operationTraits:
    kafka:
      bindings:
        kafka:
          clientId: my-app-id